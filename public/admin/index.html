<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <base href="/admin/" />
    <title>Rimpparemmi CMS</title>
  </head>
  <body>
    <!-- Prevent Decap CMS from auto-initialising so we can register the media adapter first -->
    <script>window.CMS_MANUAL_INIT = true;</script>
    <!-- Netlify Identity widget — Decap's git-gateway backend already logs in through this
         same library internally; loading it here just exposes the current login session
         (window.netlifyIdentity) to other scripts on this page, e.g. the media adapter below,
         so it can prove who is asking before it requests a Firebase upload token. -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <!-- Firebase Storage media adapter — registers before CMS.init() -->
    <script src="/admin/cms-media-adapter.js"></script>
    <!-- Start CMS after adapter is registered -->
    <script>CMS.init();</script>
    <!-- Link to the file & QR tool (Decap has no menu-link API) -->
    <a href="/admin/files.html"
       style="position:fixed;bottom:1rem;left:1rem;z-index:50;background:#c2185b;color:#fff;padding:0.5rem 0.9rem;border-radius:4px;font-family:sans-serif;font-size:0.85rem;text-decoration:none">
      Tiedostot &amp; QR
    </a>
  </body>
</html>
