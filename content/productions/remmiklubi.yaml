long_text_fi: >-
  Keväällä 2027 Kulttuuritalo Wiljamissa tapahtuu!


  Remmiklubi tuo Rovaniemelle kuusi erilaista iltaa, joissa kuullaan jazzia ja ennakkoluulotonta livemusiikkia, nähdään tanssia ja sukelletaan tanssielokuvien maailmaan.


  Lavalle nousee niin nuoria lupauksia kuin kokeneita kotimaisia ja kansainvälisiä esiintyjiä. Jokainen ilta on omanlaisensa, mutta niitä yhdistää halu tarjota kiinnostavaa, yllättävää ja laadukasta ohjelmaa rennossa klubiympäristössä.


  Tule yhteen iltaan tai ota koko kevät haltuun klubikortilla!


  ### **Kevään 2027 ohjelmisto**


  **22.1. Trio Taival**

  Pohjoismaista jazzia ja fuusiomusiikkia.


  **12.2. Moving North - Tanssileffaklubi**

  Tanssielokuvia Pohjolasta.


  **20.2. Common Spine & Kuusijärvi/Rönkkö**

  Muinaista mystiikkaa ja tulevaisuuden ääniä.


  **3.4. Tanssiteatteri MD**

  Elämän juhlaa tanssin ja elävän musiikin voimalla.


  **16.4. Tuomo Uusitalo Trio**

  Modernia jazzia pianotrion voimin.


  **14.5. Adele Sauros Basel Smash**

  Kansainvälisen jazzkvartetin konsertti.




  ### **Klubikortilla koko kevät 120 €**


  Remmiklubin henkilökohtainen klubikortti sisältää yhden sisäänpääsyn jokaiseen kuuteen klubi-iltaan.


  **Klubikortti 120 €

  Yksittäisliput 26 € / ilta**


  Klubikortilla säästät 36 € verrattuna erikseen ostettuihin lippuihin.


  Yksittäisliput tulevat myyntiin 7.12.2026.


  **Paikka:** Kulttuuritalo Wiljami, Rovaniemi
long_text_en: >-
  There's plenty happening at Kulttuuritalo Wiljami in spring 2027!


  Remmiklubi brings six unique evenings to Rovaniemi, featuring jazz, adventurous live music, dance performances and the fascinating world of dance films.


  The programme features both emerging talents and established Finnish and international artists. Each evening has its own character, but they all share a passion for presenting exciting, surprising and high-quality performances in a relaxed club atmosphere.


  Join us for one evening or enjoy the entire season with a Club Pass!




  ### Spring 2027 Programme


  **22 January | Trio Taival**

  Nordic jazz and fusion music.


  **12 February | Moving North Dance Film Club**

  Dance films from the Nordic region.


  **20 February | Common Spine & Kuusijärvi/Rönkkö**

  Ancient mysticism meets futuristic sounds.


  **3 April | Tanssiteatteri MD**

  A celebration of life through dance and live music.


  **16 April | Tuomo Uusitalo Trio**

  Modern jazz performed by a piano trio.


  **14 May | Adele Sauros Basel Smash**

  An international jazz quartet in concert.


  ### Enjoy the Entire Season with a Club Pass for €120


  The personal Remmiklubi Club Pass includes admission to all six club evenings.


  **Club Pass: €120**

  **Single tickets: €26 per evening**


  Save €36 with a Club Pass compared to purchasing individual tickets.


  Single tickets go on sale on 7 December 2026.


  **Venue:** Kulttuuritalo Wiljami, Rovaniemi, Finland
