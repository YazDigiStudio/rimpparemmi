long_text_fi: >-
  Keväällä 2027 Kulttuuritalo Wiljamissa tapahtuu!


  Remmiklubi tuo Rovaniemelle kuusi erilaista iltaa, joissa kuullaan jazzia ja ennakkoluulotonta livemusiikkia, nähdään tanssia ja sukelletaan tanssielokuvien maailmaan.


  Lavalle nousee niin nuoria lupauksia kuin kokeneita kotimaisia ja kansainvälisiä esiintyjiä. Jokainen ilta on omanlaisensa, mutta niitä yhdistää halu tarjota kiinnostavaa, yllättävää ja laadukasta ohjelmaa rennossa klubiympäristössä.


  Tule yhteen iltaan tai ota koko kevät haltuun klubikortilla!


  ### **Kevään 2027 ohjelmisto**


  **22.1. Trio Taival**

  Trio Taival vie kuulijansa pohjoismaisen jazzin ja fuusiomusiikin maisemiin. Luvassa on elävää vuoropuhelua, rytmistä rikkautta ja musiikillisia yllätyksiä.


  **12.2. Moving North - Tanssileffaklubi**

  Suosittu Moving North -tanssielokuvakiertue palaa Rovaniemelle! Illan aikana nähdään palkittuja tanssielokuvia, joissa liike nousee elokuvallisen kerronnan keskiöön. Näytöksen jälkeen yleisö pääsee keskustelemaan elokuvista panelistien kanssa.


  **20.2. Common Spine & Kuusijärvi/Rönkkö**

  Kaksi omaleimaista kokoonpanoa, yksi ilta täynnä yllätyksiä. Common Spine Collective yhdistää tanssia, musiikkia ja muinaisia tarinoita, kun taas Kuusijärvi/Rönkkö luo elektronisella harmonikalla ja rummuilla kokeellisia äänimaisemia.


  **3.4. Tanssiteatteri MD**

  Tanssiteatteri MD:n *Juhla* on elämäniloa, tanssia ja elävää musiikkia sykkivä esitys. Koreografi Ari Nummisen teoksessa juhlistetaan elämän monimuotoisuutta ja yhdessäolon voimaa.**16.4. Tuomo Uusitalo Trio**

  Modernia jazzia pianotrion voimin.


  **16.4. Tuomo Uusitalo Trio**

  Pianisti Tuomo Uusitalon johtama trio tuo Remmiklubille modernia jazzia, jossa melodisuus, improvisaatio ja muusikoiden saumaton yhteispeli kohtaavat. Luvassa on tunnelmallinen ja energinen konsertti.


  **14.5. Adele Sauros Basel Smash**

  Saksofonisti Adele Sauroksen kansainvälinen jazzkvartetti Basel Smash tuo Rovaniemelle tuoretta, rohkeaa ja rytmisesti rikasta jazzia. Konsertti on osa yhtyeen uuden *Changing Colours* -albumin julkaisukiertuetta.




  ### **Klubikortilla koko kevät 120 €**


  Remmiklubin henkilökohtainen klubikortti sisältää yhden sisäänpääsyn jokaiseen kuuteen klubi-iltaan.


  **Klubikortti 120 €

  Yksittäisliput 26 € / ilta**


  Klubikortilla säästät 36 € verrattuna erikseen ostettuihin lippuihin.


  Yksittäisliput tulevat myyntiin 7.12.2026.


  **Paikka:** Kulttuuritalo Wiljami, Rovaniemi
long_text_en: >-
  There's plenty happening at Kulttuuritalo Wiljami in spring 2027!


  Remmiklubi brings six unique evenings to Rovaniemi, featuring jazz, adventurous live music, dance performances and the fascinating world of dance films.


  The programme features both emerging talents and established Finnish and international artists. Each evening has its own character, but they all share a passion for presenting exciting, surprising and high-quality performances in a relaxed club atmosphere.


  Join us for one evening or enjoy the entire season with a Club Pass!


  ### Spring 2027 Programme


  **22 January | Trio Taival**

  Trio Taival takes listeners on a journey through Nordic jazz and fusion music. Expect lively musical dialogue, rich rhythms and unexpected twists.


  **12 February | Moving North Dance Film Club**

  The popular Moving North dance film tour returns to Rovaniemi! The evening features award-winning dance films that place movement at the heart of cinematic storytelling. After the screening, the audience is invited to join a discussion with the panellists.


  **20 February | Common Spine & Kuusijärvi/Rönkkö**

  Two distinctive acts, one evening full of surprises. Common Spine Collective combines dance, music and ancient stories, while Kuusijärvi/Rönkkö creates experimental soundscapes with electronic accordion and drums.


  **3 April | Dance theater MD**

  *Juhla* by Dance theater MD is a vibrant celebration of life through dance and live music. Choreographed by Ari Numminen, the performance celebrates the diversity of life and the joy of togetherness.


  **16 April | Tuomo Uusitalo Trio**

  Led by pianist Tuomo Uusitalo, the trio brings modern jazz to Remmiklubi, blending melody, improvisation and seamless musical interplay. Expect an atmospheric and energetic concert.


  **14 May | Adele Sauros Basel Smash**

  Led by saxophonist Adele Sauros, the international jazz quartet Basel Smash brings fresh, adventurous and rhythmically rich jazz to Rovaniemi. The concert is part of the band's new album *Changing Colours* release tour.




  ### Enjoy the Entire Season with a Club Pass for €120


  The personal Remmiklubi Club Pass includes admission to all six club evenings.


  **Club Pass: €120**

  **Single tickets: €26 per evening**


  Save €36 with a Club Pass compared to purchasing individual tickets.


  Single tickets go on sale on 7 December 2026.


  **Venue:** Culture house Wiljami, Rovaniemi, Finland
