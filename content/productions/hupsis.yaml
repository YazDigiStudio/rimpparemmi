short_text_fi: Hupsis! on päiväkoti-ikäisille lapsille suunnattu
  vuorovaikutteinen esitys, jossa kaksi esiintyjä-professoria saapuu lasten
  luokse tutkimaan sanojen, liikkeiden ja musiikin yhteiseloa. Mikä niistä
  onkaan ollut ensin?
short_text_en: Whoopsie! is an interactive performance for preschool-aged
  children, in which two professor-performers visit the children to explore how
  words, movement and music come together. But which of them came first?
long_text_fi: >-
  Mistä syntyvät laulu, tanssi ja runo?











  Professori Sananen ja professori Liikkeinen ovat kaksi hieman vinksahtanutta tutkijaa suuren kysymyksen äärellä. Professori Sananen on vakuuttunut siitä, että kaikki alkaa sanoista ja äänistä. Professori Liikkeinen taas tietää aivan varmasti, että kaiken alku on liikkeessä.


  Asian ratkaisemiseksi professorit perustavat sanojen ja liikkeiden laboratorion. Siellä sanoja, ääniä ja liikkeitä kerätään, mitataan, luokitellaan ja tutkitaan. Tietenkin äärimmäisen tieteellisesti. 


  Mutta pian kokeissa alkaa tapahtua kummia. 


  Voiko sana hypätä? Miltä pörröinen näyttää? Voiko liike puhua? Entä miltä kuulostaa pomppu?


  Kun sanat alkavat muuttua liikkeiksi, liikkeet ääniksi ja äänet säveliksi, professorien tarkasti suunniteltu koe ei enää käyttäydykään aivan odotetusti. Laboratorio täyttyy tanssista, musiikista, loruista ja uusista keksinnöistä. 


  Ja koska yksikään kunnon tutkimus ei onnistu ilman apulaisia, myös yleisön pienet tutkijat pääsevät mukaan kokeisiin.


  Hupsis! on leikkisä ja osallistava esitys sanojen, musiikin ja liikkeen ihmeellisestä yhteiselosta.





