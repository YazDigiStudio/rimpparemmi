long_text_en: >-
  Where do song, dance and poetry come from?



  Professor Sananen and Professor Liikkeinen are two slightly eccentric researchers looking for an answer to a big question. Professor Sananen is convinced that everything begins with words and sounds. Professor Liikkeinen, on the other hand, is absolutely certain that it all starts with movement.


  To settle the matter, the professors set up a laboratory of words and movement. There, words, sounds and movements are collected, measured, classified and studied. All very scientifically, of course.


  But soon, strange things begin to happen.


  Can a word jump? What does fluffy look like? Can movement speak? And what does a bounce sound like?


  As words turn into movements, movements into sounds and sounds into melodies, the professors' carefully planned experiment starts to take an unexpected turn. The laboratory fills with dance, music, rhymes and new discoveries.


  And since no proper scientific experiment can succeed without assistants, the young researchers in the audience are invited to join in the experiments too!


  Whopsie! is a playful and interactive performance exploring the curious ways in which words, music and movement come together.


