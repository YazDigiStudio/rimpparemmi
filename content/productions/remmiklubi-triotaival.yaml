short_text_fi: Pohjoismaista jazzia, vahvoja melodioita ja mukaansatempaavia rytmejä!
short_text_en: Nordic jazz, compelling melodies and infectious rhythms!
long_text_fi: >-
  Trio Taival on kolmen nuoren musiikin ammattiopiskelijan muodostama yhtye,
  jonka yhteinen kiinnostus pohjoismaiseen jazziin ja fuusiomusiikkiin kuuluu
  heidän soitossaan.


  Trion instrumentaalimusiikissa vahvat melodiat ja vaihtelevat rytmit rakentavat tunnelmia ja tarinoita ilman sanoja. Yhtyeen toinen albumi *Awakening* julkaistiin kesäkuussa 2026 ja on herättänyt huomiota jazzin ystävien keskuudessa.
long_text_en: >-
  **Trio Taival** is a group of three young musicians studying music
  professionally. Their shared interest in Nordic jazz and fusion comes through
  in their playing.


  In the trio’s instrumental music, strong melodies and shifting rhythms create moods and tell stories without words. Their second album, *Awakening*, was released in June 2026 and has attracted attention among jazz fans.
