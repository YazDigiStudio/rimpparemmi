  Come and enjoy an evening full of emotion and atmosphere!
long_text_fi: >-
  Lapin Urheiluopiston tanssinopiskelijat valtaavat Remmi Liveklubin lavan
  tiistaina 24.11. kahden esityksen voimin klo 13 ja 19.


  Illan aikana nähdään opiskelijoiden omia teoksia sekä syksyn aikana opettajien johdolla valmistettuja kokonaisuuksia. Luvassa on monipuolinen kattaus tanssia, erilaisia liikekieliä ja opiskelijoiden omia näkökulmia.


  Opiskelijat lavalla tarjoaa kurkistuksen siihen, mitä tanssinopiskelijoiden syksyn aikana on syntynyt harjoittelun, kokeilemisen ja oman luovan työskentelyn tuloksena. Näyttämöllä kohtaavat erilaiset tekijät, ideat ja tunnelmat.


  Tule kokemaan tanssia läheltä ja nauttimaan tunteista ja tunnelmista!




  **Remmi Liveklubi – Opiskelijat lavalla** 

  Ti 24.11. klo 13 ja 19

  Kulttuuritalo Wiljami
long_text_en: >-
  Dance students from Lapland Sports Institute take over the Remmi Live Club
  stage on 24 November with two performances at 1 pm and 7 pm.


  The programme features the students’ own works as well as pieces created under the guidance of their teachers during the autumn term. Audiences can look forward to a diverse selection of dance, different movement styles and the students’ own perspectives.


  Students on Stage offers a glimpse into what has emerged during the students’ autumn term through training, experimentation and creative work. The stage brings together different performers, ideas and moods.


  Come and experience dance up close and enjoy an inspiring mix of emotions and atmosphere!




  **Remmi Live Club – Students on Stage**

  24 November at 1 pm and 7 pm

  Cultural House Wiljami
