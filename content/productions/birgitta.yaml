long_text_en: >-
  There’s a wedding. The church is filled with people, flowers, and
  expectations. Everything is ready. Except the bride.


  The groom is kind. Far too kind. The best man's gaze lingers a little too long. Leopard-print leggings take up space someone else thought was theirs. And in the middle of it all, the narrator speaks directly to the audience, already knowing how this will end.


  Live music fills the stage. The tango keeps returning. The celebration builds, unravels, and goes a little too far. And then even further.


  *Birgitta – even the birds weep in the sky* premiered on October 16 at Culture House Wiljami as Dance Theatre Rimpparemmi's autumn production. Directed by Matti Paloniemi, the wedding transforms into a visual whirlwind where beauty and rawness go hand in hand. Nothing is polished away — not the mess, not the emotion. It is absurd, physical, and instantly recognisable. 


  People stumble into each other's lives and perhaps find something they weren’t even looking for.
