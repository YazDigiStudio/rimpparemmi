long_text_fi: >-
  **Teatterin, tanssin ja absurdin komedian rajapinnoilla kiemurteleva
  yhteistuotanto.**


  **Kulttuuritalo Wiljamissa syksyllä 2027.**

  Esitysajat ilmoitetaan myöhemmin. Liput tulevat myyntiin loppukeväästä 2027.


  Toimisto on esitys työn murroksesta, viikonlopun kaipuusta ja absurdin kokemuksesta.


  Keskiössä on viiden hengen muodostama yhteisö, joka jakaa tilan ja puolet valveillaoloajastaan. Heidän työpäivänsä täyttyvät muodottomista hankkeista, päälle käyvistä deadlineista, tarkoitustaan etsivistä palavereista ja loputtomiin päivittyvistä järjestelmistä.


  Toimisto on tila, joka vaatii jatkuvaa toimintaa, jossa ihminen sinnittelee pitääkseen asemansa näppäinkomentojen painelijana. Valonnopeudella uupumattomasti etenevät bitit huutavat huomiota ja kiertävät maapallon kymmenesti yhden ihmishenkäyksen aikana. Hengitä tiheämmin.


  Avataan ikkuna, toinen ja kolmas. Mihin se ensimmäinen katosi?


  Epäjärjestys valtaa työpisteen, aika kuluttaa ja työttömyys pelottaa. Pirisee, piippaa, hyrisee, monistuu, toistuu. Lounaalla kieli hajoaa ja taukojumppa käy työstä. Huomenna uudestaan. Onneksi on kahvia — onhan?


  Toimisto on satiirinen kuvaus ihmisen osasta kustannustehokkuutta ja automaatiota janoavassa maailmassa. Teatterin, tanssin ja absurdin komedian rajapinnoilla kiemurteleva esitys paljastaa todellisuuden, jossa työttömyys on työntekijän kuolema.
long_text_en: >-
  **A co-production weaving between theatre, dance and absurd comedy.**


  **At Kulttuuritalo Wiljami in autumn 2027.**

  Performance dates will be announced later. Tickets go on sale in late spring 2027.


  Toimisto is a performance about the changing world of work, the longing for the weekend and the experience of the absurd.


  At its heart is a community of five people who share a space and half their waking hours. Their working days are filled with shapeless projects, looming deadlines, meetings in search of a purpose and endlessly updating systems.


  The office is a space that demands constant activity, where people struggle to hold on to their place as keyboard command operators. Tireless bits travelling at the speed of light clamour for attention and circle the globe ten times in the span of a single human breath. Breathe faster.


  Open a window, then another, then a third. Where did the first one go?


  Disorder takes over the workstation, time wears you down and unemployment looms. Ringing, beeping, humming, multiplying, repeating. At lunch, language falls apart and even the exercise break feels like work. Tomorrow, all over again. At least there’s coffee — isn’t there?


  Toimisto is a satirical portrayal of the human condition in a world hungry for cost efficiency and automation. Weaving between theatre, dance and absurd comedy, the performance reveals a reality in which unemployment is the death of the worker.
